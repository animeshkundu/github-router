name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_call:

# Cancel superseded runs on the same PR. Without this, every push to an open PR
# left the previous run burning all 15 jobs to completion, delaying the run that
# actually matters and occupying runners for a result nobody would read.
#
# Keyed on the ref, and NOT applied to workflow_call: release.yml invokes this
# workflow, and a shared group there could cancel a release's gate mid-flight.
# `github.workflow` scopes the group so PR runs cannot collide with other
# workflows on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # macOS earns its slot on PATH SEMANTICS, not general breadth. The
        # colbert workspace-identity logic must agree across three filesystem
        # behaviours — Windows extended-length `\\?\` paths, macOS's
        # `/var`->`/private/var` and `/tmp`->`/private/tmp` symlinks, and Linux
        # case-sensitivity. A semantic-search outage was traced to exactly that
        # mismatch and was invisible to a two-OS matrix. Those identity tests
        # live in the unit suite, which is why macOS is here and not in
        # `node-compat`.
        #
        # Single bun line as of 2026-08-12: the supported runtime is 1.4, which
        # ships as `canary` (no 1.4.x is on npm yet, so `"1.4"` would not
        # resolve). Recorded rather than deleted: `1.3.14` was the stable GATE
        # and is still what `npm i -g bun` serves, so CI now validates a
        # PRE-RELEASE channel only and a bug reproducing solely on current
        # stable will not be caught here. A streaming test once passed on
        # canary/Windows and failed on 1.3.14/ubuntu, because when bun's socket
        # reaper fires is a platform- and version-specific internal.
        bun-version: ["canary"]
    runs-on: ${{ matrix.os }}
    # A hung job would otherwise sit on a runner for GitHub's 360-minute
    # default. The full suite is minutes, not hours, so this is a runaway
    # backstop set far above any legitimate run — it turns an infinite hang
    # into a visible failure without ever truncating real work.
    timeout-minutes: 45
    # `canary` was allowed to fail while `1.3.14` carried the blocking gate:
    # a red tick for someone else's unreleased bug would erode the zero-red-CI
    # rule that makes a red tick mean something. That trade only works while a
    # stable lane is also running. With the matrix narrowed to the 1.4 line,
    # canary IS the supported runtime, so it must block — leaving the old
    # conditional in place would have made every unit-suite job advisory and
    # turned CI permanently green regardless of failures.
    continue-on-error: false
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Lint/typecheck/license are runtime-independent, so run them once rather
      # than on every matrix cell. Pinned to ubuntu ONLY: the old condition also
      # required bun '1.3.14', which the 2026-08-12 narrowing removed from the
      # matrix. Left as-is it would have silently stopped running lint,
      # typecheck, and the license guard ANYWHERE in CI.
      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        run: bun run lint:all

      - name: Type check
        if: matrix.os == 'ubuntu-latest'
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: License guard (no AGPL/CloudCLI in tarball)
        if: matrix.os == 'ubuntu-latest'
        run: node scripts/check-pack-no-agpl.mjs

      - name: Ensure ast-grep (mode:"ast" tests skip silently without it)
        run: bun scripts/ensure-ast-grep.ts

      - name: Test
        run: bun scripts/run-tests.ts

  node-compat:
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # The supported node lines: 24 is what release.yml builds and publishes
        # with, 26 is current. Node — not our code — is what changes underneath
        # us: `--help` once aborted on the Windows + node 24 lane while the
        # identical build passed on node 22, and that lane only existed because
        # this matrix was widened.
        #
        # 22 was dropped on 2026-08-12 with the rest of the narrowing. Recorded
        # rather than deleted: it was the older LTS most users were on, so a
        # regression that only reproduces there now reaches users first.
        #
        # These lanes run the E2E surface (CLI usage paths, the mock-API smoke,
        # the serve WS relay). The UNIT suite cannot join them: it is written
        # against `bun:test`, which does not run under node at all.
        node-version: ["24", "26"]
    runs-on: ${{ matrix.os }}
    # Runaway backstop; see the note on the `ci` job. The mock-API smoke here
    # already hard-fails at 30s, so this only catches a wedge outside it.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "canary"

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install and build
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Verify CLI help on Node.js
        run: node dist/main.js --help

      - name: Serve WS relay smoke (Node)
        shell: bash
        run: |
          bun build src/lib/serve/reverse-proxy.ts --target=node --format=esm --outfile "$RUNNER_TEMP/rp.mjs"
          node scripts/serve-ws-smoke.mjs "$RUNNER_TEMP/rp.mjs"

      - name: Verify no unguarded Bun references
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const lines = fs.readFileSync("dist/main.js", "utf8").split("\n");
            const issues = [];
            for (let i = 0; i < lines.length; i++) {
              if (/Bun\./.test(lines[i]) && !/typeof Bun/.test(lines[i])) {
                const ctx = lines.slice(Math.max(0, i-3), i+1).join("\n");
                if (!/typeof Bun/.test(ctx)) issues.push({ line: i+1, text: lines[i].trim() });
              }
            }
            if (issues.length) { console.error("Unguarded Bun refs:", issues); process.exit(1); }
            console.log("OK: all Bun references guarded");
          '

      - name: E2E smoke test on Node.js (with mock API)
        shell: bash
        run: |
          node -e '
            const http = require("http");
            const { spawn } = require("child_process");

            // 1. Start mock GitHub/Copilot API server
            const mockApi = http.createServer((req, res) => {
              res.setHeader("content-type", "application/json");
              if (req.url.includes("/copilot_internal/v2/token")) {
                res.end(JSON.stringify({ token: "mock-token", refresh_in: 99999, endpoints: { api: "http://127.0.0.1:19877" } }));
              } else if (req.url.includes("/user")) {
                res.end(JSON.stringify({ login: "ci-test" }));
              } else if (req.url.includes("/models")) {
                res.end(JSON.stringify({ data: [{ id: "gpt-4", capabilities: { family: "gpt-4", limits: {}, object: "model_capabilities", supports: {}, tokenizer: "o200k_base", type: "chat" }, model_picker_enabled: true, name: "GPT-4", object: "model", preview: false, vendor: "OpenAI", version: "gpt-4" }] }));
              } else {
                res.end(JSON.stringify({ id: "test", object: "chat.completion", choices: [{ message: { content: "hello" } }] }));
              }
            });
            mockApi.listen(19877, "127.0.0.1", () => {
              console.log("Mock API on :19877");

              // 2. Start github-router pointing at mock
              const router = spawn("node", ["dist/main.js", "start", "-p", "19876"], {
                stdio: "inherit",
                env: { ...process.env, GITHUB_API_URL: "http://127.0.0.1:19877", COPILOT_API_URL: "http://127.0.0.1:19877", GH_TOKEN: "mock-github-token" }
              });

              // 3. Poll until router responds
              const check = () => http.get("http://127.0.0.1:19876/models", r => {
                let body = "";
                r.on("data", c => body += c);
                r.on("end", () => {
                  if (r.statusCode === 200 && body.includes("gpt-4")) {
                    console.log("OK: router responds with models from mock API");
                    router.kill(); mockApi.close(); process.exit(0);
                  } else {
                    console.log("Status:", r.statusCode, "Body:", body.slice(0, 200));
                    setTimeout(check, 500);
                  }
                });
              }).on("error", () => setTimeout(check, 500));
              setTimeout(check, 3000);
              setTimeout(() => { console.error("FAIL: timeout"); router.kill(); mockApi.close(); process.exit(1); }, 30000);
            });
          '
